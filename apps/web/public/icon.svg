<?xml version="1.0" encoding="UTF-8"?>
<!--
  Quilty icon master source.

  Placeholder visual identity: a neutral gradient backdrop with a
  geometric 'Q' glyph (circular ring + diagonal tail). All rendered
  PNG/ICO/JPG assets in this directory derive from THIS file via the
  `pnpm icons:build` workspace script (invoke as
  `pnpm filter web icons:build` from the repo root); at the brand
  identity handoff, swap this SVG + `og-default.jpg` and rerun.

  Design constraints:
   - 512x512 viewBox so maskable variants get the full safe-zone budget
   - Path-based glyph (no system-font dependency in sharp/librsvg)
   - Solid background fill so the maskable transform stays opaque
   - Stroke widths sized for 192px legibility (smallest manifest tier)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <g fill="none" stroke="#27272a" stroke-width="40" stroke-linecap="round">
    <circle cx="248" cy="248" r="120" />
    <line x1="320" y1="320" x2="396" y2="396" />
  </g>
</svg>

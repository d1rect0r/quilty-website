# GitHub Actions CI pipeline (D22 + D36 + ADR-0001).
#
# Runs on every PR + push to main. Jobs:
#   1. install — pnpm install with frozen lockfile + cache
#   2. lint — ESLint flat + Prettier --check
#   3. hygiene — syncpack + Knip + depcruise + security.txt expires
#                gate + type-coverage + secretlint + openapi codegen drift
#   4. typecheck — TypeScript strict across workspaces
#   4b. sst-config — typecheck sst.config.ts against generated SST platform types
#   5. test — Vitest unit (with v8 coverage)
#   6. test-e2e — Playwright e2e + a11y (axe-core WCAG 2.2 AA + smoke + security + seo)
#   7. build — Next.js production build + size-limit budgets + PR-diff comment
#   8. supply-chain — CycloneDX SBOM artifact + advisory dependency audit
#
# Supply-chain posture (ADR-0007 + 2026-06-18 enterprise validation): cooldown
# (Renovate minimumReleaseAge), lifecycle-scripts-off (.npmrc
# enable-pre-post-scripts=false), and frozen-lockfile installs are enforced
# elsewhere; this job adds the missing SBOM artifact for fast "are we affected?"
# triage during npm-ecosystem incidents, plus a non-blocking advisory audit.
#
# Concurrency cancellation per PR: a new push cancels in-flight runs on
# the same head ref. Saves CI minutes + keeps queue depth bounded.
#
# Node 24 + pnpm 10 per S3. Turbo remote cache + Sentry source-map
# upload activate at the SST deploy gate (TURBO_TOKEN +
# SENTRY_AUTH_TOKEN secrets, gated until quilty-aws/website-baseline/
# vends the OIDC role).
#
# webServer-based Playwright tests use `pnpm dev`; switch to
# production-mode `pnpm build && pnpm start` once Lighthouse CI lands
# and the build path is stable enough to keep the e2e wall-clock under
# the CI timeout budget.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # `install` is the lockfile-validation + cache-warming gate. Velite
  # prebuild is invoked per-consumer-job (each gets a fresh runner with
  # its own .velite/ build) — running it here would be wasted work
  # (Round-5 IaC reviewer L2).
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint + format
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  hygiene:
    # Tier-1 dev-tooling gates (ADR-0007). Run early — fast, catches the
    # version-drift / unused-deps / graph-rule classes of regression
    # before the heavier typecheck + test jobs do.
    name: Hygiene (syncpack + Knip + depcruise + security-txt + type-coverage + secretlint + openapi-drift)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version drift check (syncpack)
        run: pnpm syncpack:lint
      - name: Unused exports / files / deps (Knip)
        run: pnpm knip
      - name: Import-graph rule validation (dependency-cruiser)
        run: pnpm depcruise
      - name: security.txt expires gate (≥30 days, RFC 9116)
        run: pnpm security-txt:check
      - name: Type coverage threshold (≥97%)
        run: pnpm type-coverage
      - name: Secret scan (secretlint)
        run: pnpm secretlint
      - name: OpenAPI codegen drift (spec ↔ generated types, ADR-0003)
        # Regenerates @quilty/shared-types from the COMMITTED specs in
        # packages/shared-types/spec/ and fails if src/generated/*.ts is
        # stale. Catches the case where a spec is updated (via the
        # cross-repo sync script) without re-running codegen. CI cannot
        # reach the sibling quilty-aws repo, so it checks against the
        # in-repo committed specs only.
        run: pnpm --filter @quilty/shared-types codegen:check

  supply-chain:
    # Supply-chain hardening (ADR-0007 + 2026-06-18 enterprise validation).
    # SBOM gives a minutes-to-answer inventory during npm-ecosystem incidents
    # (Shai-Hulud worm, chalk/debug hijack, TanStack). Audit is a per-run
    # visibility signal; Renovate vulnerabilityAlerts is the gating path.
    name: Supply chain (SBOM + audit)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM (Syft, from pnpm-lock.yaml)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: quilty-website.cdx.json
          artifact-name: quilty-website-sbom.cdx.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Advisory dependency audit (non-blocking signal)
        # continue-on-error: a new transitive advisory must not block unrelated
        # PRs; the gating path is Renovate vulnerabilityAlerts (minimumReleaseAge 0).
        continue-on-error: true
        run: pnpm audit --audit-level high

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      - run: pnpm typecheck

  sst-config:
    name: Typecheck sst.config.ts
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # sst.config.ts is NOT in any workspace tsconfig (excluded from
      # `turbo run typecheck` + type-coverage); its types come from the
      # generated `.sst/platform/`. `sst install` materialises those — it only
      # downloads the platform + providers, no AWS creds needed. Cached on the
      # lockfile so the provider download is paid once per dependency change.
      - name: Cache SST platform
        uses: actions/cache@v4
        with:
          path: .sst
          key: sst-platform-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec sst install
      - run: pnpm typecheck:sst

  test:
    name: Unit tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      - run: pnpm test

  test-e2e:
    name: Playwright e2e + a11y
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `CSRF_SECRET` is required by proxy.ts which mints the
    # `__Host-quilty_csrf` cookie on first /contact GET via the
    # Web Crypto `generateCsrfTokenEdge()` helper (D113 + open risk #7
    # closure). The HMAC primitive enforces ≥ 32 chars at runtime
    # (≥ 256 bits of entropy for HMAC-SHA-256). The value below is a
    # CI-only test secret committed in plaintext on purpose — it never
    # touches a production code path (production reads the SST secret
    # via the website-baseline Pulumi vending layer). `turbo.json`
    # `test:e2e` env allowlist propagates this through the build + start
    # tasks to proxy.ts; without it, proxy.ts throws at HMAC setup
    # and the form's hidden CSRF input is unverifiable.
    #
    # NEXT_PUBLIC_SITE_URL is required by app/layout.tsx + metadata
    # builders at build time; the value matches the local Playwright
    # baseURL so absolute-URL canonical/og fields resolve consistently.
    env:
      CSRF_SECRET: ci-test-only-csrf-secret-32chars-min-aaa
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Enables the /dev/boom error-boundary test route in production
      # builds — the route gated by `NODE_ENV !== 'production'` would
      # otherwise 404, blocking the error-boundary Playwright suite.
      # Set ONLY inside the CI test runner; never in any deployable
      # image. See apps/web/app/dev/boom/page.tsx for the gate logic.
      QUILTY_TEST_BOOM_ENABLED: '1'
      # The e2e suite runs the PRODUCTION build (`pnpm start`,
      # NODE_ENV=production), so the ADR-0030 fail-closed guard refuses
      # the in-memory rate-limiter / consent / guest-state adapters unless
      # this explicit opt-in is set. The CI runner has no DynamoDB tables —
      # it deliberately exercises the AWS-parked interim wiring — so the
      # opt-in is the documented + intended mechanism here. Never set in a
      # deployable image (production sets the real table envs instead).
      QUILTY_ALLOW_INMEMORY_ADAPTERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      # Production build before Playwright runs. playwright.config.ts
      # spawns `pnpm start` in CI mode (not `pnpm dev`) to avoid
      # Turbopack hot-compile races that previously caused systemic
      # test failures across error-boundary / legal-pages / mhmda-page /
      # gpc-force-off / contact-form suites.
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    # All gates must pass before the build job — including e2e per
    # D22 (axe-core fail-on-violation). Round-5 IaC reviewer M2:
    # `test-e2e` was missing from `needs:`, letting axe failures slip
    # past the merge gate when branch protection only required `build`.
    name: Next.js build
    needs: [lint, hygiene, typecheck, sst-config, test, test-e2e]
    runs-on: ubuntu-latest
    # 25-minute ceiling accommodates the webpack production build
    # (per ADR-0018, opted-out of Turbopack for per-route chunk
    # measurement) + andresz1/size-limit-action rebuilds the base
    # branch under the hood to compute the PR diff, doubling the build
    # cost on PR events. 15-minute ceiling tripped on cold-cache runs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # NEXT_PUBLIC_SENTRY_DSN is a public ingest key — visible in
          # client bundles by design. Stored as a `var` so it isn't masked
          # in logs (Round-5 IaC reviewer L4).
          #
          # SENTRY_AUTH_TOKEN intentionally NOT exported here (Round-5
          # final-QA IaC L2) — there is no source-map upload step in this
          # job. The token lands when `.github/workflows/deploy.yml`
          # activates next sprint (and again at M2 when Lighthouse CI
          # adds source-map upload to the build path).
          NEXT_PUBLIC_SITE_URL: https://my-quilty.com
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Bundle size budgets (size-limit)
        run: pnpm size

      - name: Size-limit diff comment on PR
        # Comments a delta-vs-base-branch table on the PR. Fails the
        # job when any per-route or first-load budget is exceeded.
        # Skipped on push-to-main events (no PR to comment on).
        #
        # Note on cost: this action ALSO runs `pnpm install` + the
        # build script on the base branch under the hood (the only
        # way to compute the diff). The 25-minute build-job ceiling
        # accommodates this. Migration to Codecov Bundle Analysis
        # eliminates the double-build cost once the first 30-day
        # baseline lands — tracked on the C.1 watchlist.
        if: github.event_name == 'pull_request'
        # Major-version tag `v1` (latest stable as of 2026-05-29).
        # The action has no v2 release — refs/tags/v2 does not exist
        # on the upstream repo, causing a "Set up job" failure with
        # "Unable to resolve action ... v2". Pin to v1 (floating major).
        uses: andresz1/size-limit-action@v1
        # The action rebuilds the BASE branch under the hood to compute
        # the diff, and that build runs in the action's own process — it
        # does NOT inherit the previous `pnpm build` step's env. Since
        # `lib/env.ts` validates NEXT_PUBLIC_SITE_URL at build boot
        # (ADR-0030 fail-closed config), the base build throws without
        # it. Mirror the head build's env here so both sides build.
        env:
          NEXT_PUBLIC_SITE_URL: https://my-quilty.com
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # skip_step: build — the head-branch build already ran in
          # the previous step; the action only needs to build the
          # base branch for diff.
          skip_step: build
          script: pnpm size
          package_manager: pnpm

      - name: Upload build artifact for Lighthouse CI
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 1

  lighthouse:
    # Lighthouse CI against `next start` (production build).
    #
    # INFORMATIONAL-ONLY (continue-on-error) until M4-M6 / TW-015: per
    # ADR-0018 + .size-limit.cjs, Lighthouse CI is explicitly deferred to
    # M4-M6 — it "needs preview URLs + 3+ runs per URL for INP denoise",
    # and size-limit (the `build` job) is the binding perf gate at M1.6.
    # `.lighthouserc.json` currently asserts NOTHING (empty `assert`), and
    # the collect step can't load http://localhost against a prod build that
    # emits HSTS (Lighthouse's Chrome enforces an HTTPS interstitial that
    # Playwright's Chromium does not) — the preview-HTTPS-URL setup that
    # lands at M4-M6 is what makes this run cleanly. Keeping it green-blocking
    # now would gate merges on a not-yet-functional check. It still runs so
    # the report is visible; it just doesn't fail the workflow.
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web
      - name: Run Lighthouse CI
        # Step-level continue-on-error so the job concludes SUCCESS (the
        # report is still uploaded). Informational-only until M4-M6 / TW-015
        # per the job comment above: empty asserts + the http-localhost-vs-
        # prod-HSTS collect limitation that preview HTTPS URLs resolve.
        continue-on-error: true
        run: pnpm lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # lhci runs `next start` against the downloaded prod artifact.
          # next.config.ts imports lib/env.ts, so `createEnv` re-validates
          # at server boot (ADR-0030 fail-closed config) — NEXT_PUBLIC_SITE_URL
          # is required or next.config fails to load + the server never serves
          # (Chrome interstitial). CSRF_SECRET + the in-memory opt-in mirror
          # the e2e job so any forms/container-constructing route also serves.
          # CI-only test values; production wires the real SST secrets + tables.
          NEXT_PUBLIC_SITE_URL: https://my-quilty.com
          CSRF_SECRET: ci-test-only-csrf-secret-32chars-min-aaa
          QUILTY_ALLOW_INMEMORY_ADAPTERS: 'true'

# GitHub Actions CI pipeline (D22 + D36 + ADR-0001).
#
# Runs on every PR + push to main. Jobs:
#   1. install — pnpm install with frozen lockfile + cache
#   2. lint — ESLint flat + Prettier --check
#   3. typecheck — TypeScript strict across workspaces
#   4. test — Vitest unit (with v8 coverage)
#   5. test:a11y — Playwright + axe-core WCAG 2.2 AA
#   6. test:e2e — Playwright smoke + security + seo
#   7. build — Next.js production build (verifies the full app compiles)
#
# Concurrency cancellation per PR: a new push cancels in-flight runs on
# the same head ref. Saves CI minutes + keeps queue depth bounded.
#
# Node 24 + pnpm 10 per S3. Turbo remote cache + Sentry source-map
# upload wired at the next-sprint deploy phase (TURBO_TOKEN +
# SENTRY_AUTH_TOKEN secrets, gated until OIDC role exists).
#
# Round-5 perf-bundle reviewer note: webServer-based Playwright tests
# use `pnpm dev`; M2+ swap to production-mode `pnpm build && pnpm start`
# once Lighthouse CI lands.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # `install` is the lockfile-validation + cache-warming gate. Velite
  # prebuild is invoked per-consumer-job (each gets a fresh runner with
  # its own .velite/ build) — running it here would be wasted work
  # (Round-5 IaC reviewer L2).
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint + format
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  hygiene:
    # Tier-1 dev-tooling gates (ADR-0007). Run early — fast, catches the
    # version-drift / unused-deps / graph-rule classes of regression
    # before the heavier typecheck + test jobs do.
    name: Hygiene (syncpack + Knip + depcruise + type-coverage)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version drift check (syncpack)
        run: pnpm syncpack:lint
      - name: Unused exports / files / deps (Knip)
        run: pnpm knip
      - name: Import-graph rule validation (dependency-cruiser)
        run: pnpm depcruise
      - name: Type coverage threshold (≥97%)
        run: pnpm type-coverage
      - name: Secret scan (secretlint)
        run: pnpm secretlint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      - run: pnpm typecheck

  test:
    name: Unit tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      - run: pnpm test

  test-e2e:
    name: Playwright e2e + a11y
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec velite build --config ../../velite.config.ts
      - run: pnpm --filter web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    # All gates must pass before the build job — including e2e per
    # D22 (axe-core fail-on-violation). Round-5 IaC reviewer M2:
    # `test-e2e` was missing from `needs:`, letting axe failures slip
    # past the merge gate when branch protection only required `build`.
    name: Next.js build
    needs: [lint, hygiene, typecheck, test, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # NEXT_PUBLIC_SENTRY_DSN is a public ingest key — visible in
          # client bundles by design. Stored as a `var` so it isn't masked
          # in logs (Round-5 IaC reviewer L4).
          #
          # SENTRY_AUTH_TOKEN intentionally NOT exported here (Round-5
          # final-QA IaC L2) — there is no source-map upload step in this
          # job. The token lands when `.github/workflows/deploy.yml`
          # activates next sprint (and again at M2 when Lighthouse CI
          # adds source-map upload to the build path).
          NEXT_PUBLIC_SITE_URL: https://my-quilty.com
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Bundle size budgets (size-limit)
        run: pnpm size

      - name: Upload build artifact for Lighthouse CI
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 1

  lighthouse:
    # Lighthouse CI against pnpm start (production build) — CWV budgets
    # in .lighthouserc.json. Fails the merge gate on a11y or SEO score
    # regressions, warns on perf (calibrated as M1 baseline lands).
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web
      - name: Run Lighthouse CI
        run: pnpm lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

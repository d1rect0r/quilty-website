# SST 4.x deploy pipeline — INERT until the `DEPLOY_ENABLED` repo
# variable is flipped to `true` AND `quilty-aws/website-baseline/`
# vends the OIDC role + permission boundary.
#
# Activation: Settings → Secrets and variables → Actions → Variables →
# set `DEPLOY_ENABLED` to `true`. All three jobs gate on the variable so
# turning the deploy pipeline on/off is a one-edit operation in the
# Settings UI, reversible without a code change.
#
# Per ADR-0001 D2 + U5 + U6: SST runs in the `development` AWS account
# at Phase 0; DNS records land via `quilty-aws/dns/` (production account)
# in a coordinated manual-PR two-step (U6).
#
# The workflow shape is committed at M1 alongside the rest of the
# scaffold so the deploy contract gets reviewed when humans + AI both
# understand the surrounding code — not bolted on later under deadline
# pressure.

name: Deploy (SST)

on:
  # workflow_dispatch removed (Round-5 final-QA IaC M2). A manual trigger
  # would let any contributor with write access deploy any branch to
  # preview-pr-* without a PR — bypassing required-reviewer gates on the
  # `preview` GitHub Environment. Re-add only with an `actor`-scoped
  # guard if a genuine ops use case appears.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `closed` type required so `cleanup-preview` can fire when a PR
    # merges or is abandoned — without it, preview stacks leak (Round-5
    # IaC reviewer HIGH finding).
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false # never cancel a prod deploy mid-flight

# Minimum-privilege defaults — only contents:read at the workflow level.
# Jobs that need OIDC declare `id-token: write` at the job scope so
# non-AWS jobs don't inherit credential-issuing capability (Round-5 IaC
# reviewer M3).
permissions:
  contents: read

jobs:
  preview:
    # Activation gate — flip the `DEPLOY_ENABLED` repo variable to `true`
    # (Settings → Secrets and variables → Actions → Variables) once
    # quilty-aws/website-baseline/ has vended the OIDC role +
    # permission boundary + SSM params. Gating on a variable rather than
    # editing this `if:` line keeps activation reviewable in the Settings
    # UI and reversible without a code change.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' }}
    name: Preview deploy (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Preview-specific OIDC role vended by
          # quilty-aws/website-baseline/ (next sprint). Distinct from the
          # dev-stage deploy role per Round-5 IaC reviewer M1 — preview
          # has narrower permission boundary scoped to
          # `sst deploy --stage preview-pr-*`.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PREVIEW }}
          aws-region: us-east-1

      - name: SST preview deploy
        run: pnpm sst deploy --stage preview-pr-${{ github.event.pull_request.number }}
        env:
          # NEXT_PUBLIC_SENTRY_DSN is a public Sentry ingest key — it's
          # baked into the client bundle so storing as a `var` (visible
          # in logs) is correct. SENTRY_AUTH_TOKEN (source-map upload)
          # remains a secret. Per Round-5 IaC reviewer L4.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PREVIEW }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sst.config.ts hard-gates on WAF_WEB_ACL_ARN (Round-5 final-QA
          # IaC C1 — no public hostname without WAF + rate limit). The
          # ARN is vended by quilty-aws/website-baseline/ as a SSM param
          # and exposed via this var.
          SST_DEPLOY_GATE_PASSED: 'true'
          WAF_WEB_ACL_ARN: ${{ vars.WAF_WEB_ACL_ARN }}
          # Permissions boundary SST attaches to every Lambda exec role it creates
          # (W2 / ADR-0071 sec 5; vended by quilty-aws website-baseline output).
          QUILTY_WEB_DEPLOY_BOUNDARY_ARN: ${{ vars.QUILTY_WEB_DEPLOY_BOUNDARY_ARN }}
          # sst.config.ts also hard-gates on QUILTY_PSEUDONYM_PEPPER (the
          # HIPAA + GDPR Art 4(5) pseudonymisation salt for log-side
          # hashing). Without it the deploy throws. It is a SECRET (the
          # SSM-pointer value vended from AWS Secrets Manager by
          # quilty-aws/website-baseline/), not a `var`. PROVISIONING: store
          # it as an ENVIRONMENT secret on the `preview` + `production`
          # GitHub Environments (with required reviewers on `production`),
          # NOT a repo-wide secret — it must never be readable by non-deploy
          # workflows. (Applies to SENTRY_AUTH_TOKEN + the AWS role ARNs too.)
          QUILTY_PSEUDONYM_PEPPER: ${{ secrets.QUILTY_PSEUDONYM_PEPPER }}
          # Preview stages are NEVER indexed (they serve real content on a
          # raw CloudFront URL). Hard-coded 'true' so the build bakes the
          # sitewide X-Robots-Tag noindex header — this is what makes the
          # "preview stages are noindex" invariant in sst.config.ts true.
          SITE_FORCE_NOINDEX: 'true'

  cleanup-preview:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event.action == 'closed' }}
    name: Cleanup preview (PR closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PREVIEW }}
          aws-region: us-east-1
      # NOTE on guard-bash.sh: that hook only applies to Claude Code
      # PreToolUse Bash invocations. GitHub Actions runners are a
      # separate execution environment — the hook has no effect here.
      # The Round-5 harness gap (guard-bash.sh blocking all `sst remove`
      # variants) affects Claude sessions only; it is documented in
      # docs/runbook/m1_post_scaffold_checklist.md as a manual patch for
      # the user to apply before invoking `/sst-destroy-previews`
      # locally.
      - run: pnpm sst remove --stage preview-pr-${{ github.event.pull_request.number }}
        env:
          # `sst remove` still executes sst.config.ts's run() to build the
          # resource graph before destroying it, so it hits the SAME
          # config-eval throw-gates as a deploy (SST_DEPLOY_GATE_PASSED +
          # NEXT_PUBLIC_SENTRY_DSN + WAF_WEB_ACL_ARN + QUILTY_PSEUDONYM_PEPPER).
          # Without these the teardown fails and preview stacks leak
          # (orphaned CloudFront + Lambda + S3). The values are not used to
          # destroy anything — they only satisfy the gate. (A cleaner future
          # refinement is to make those deploy-only gates skip on `remove`;
          # deferred to deploy-activation when `sst` can actually be run +
          # tested — AWS account placement is currently parked.)
          SST_DEPLOY_GATE_PASSED: 'true'
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          WAF_WEB_ACL_ARN: ${{ vars.WAF_WEB_ACL_ARN }}
          # Permissions boundary SST attaches to every Lambda exec role it creates
          # (W2 / ADR-0071 sec 5; vended by quilty-aws website-baseline output).
          QUILTY_WEB_DEPLOY_BOUNDARY_ARN: ${{ vars.QUILTY_WEB_DEPLOY_BOUNDARY_ARN }}
          QUILTY_PSEUDONYM_PEPPER: ${{ secrets.QUILTY_PSEUDONYM_PEPPER }}

  deploy-prod:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Deploy to development account (Phase 0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Dev-stage deploy role — distinct from preview role
          # (Round-5 IaC reviewer M1). Phase 1 migration to
          # `marketing-prod` (per D47) flips this role target.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: us-east-1
      # `sst deploy --stage prod*`/`production*` is blocked by
      # guard-bash.sh in Claude sessions; the `dev` stage corresponds to
      # Phase 0 in the existing `development` AWS account (D47). Phase 1
      # migration to `marketing-prod` flips the stage name + the OIDC
      # role target.
      # M2.8 — deploy-window alarm suppression. Disable alarm ACTIONS (not the
      # alarms) for the SST-authored website alarms so a deploy's brief cold-start
      # / invalidation blip can't self-page. Scoped to the `quilty-web-dev-`
      # prefix so the quilty-aws-owned `quilty-marketing-prod-*` alarms are
      # untouched. Best-effort (continue-on-error) so a first deploy — before any
      # alarm exists — isn't blocked. Re-enabled unconditionally after deploy.
      - name: Suppress website alarm actions during deploy
        continue-on-error: true
        run: |
          set -uo pipefail
          # Read names into an array, one per line, so each becomes a separate
          # argv. `--output text` for a flat-list query is tab-separated on one
          # line, so normalise tabs→newlines and drop blanks — robust across AWS
          # CLI output-format quirks (no reliance on unquoted word-splitting).
          mapfile -t names < <(aws cloudwatch describe-alarms --region us-east-1 \
            --alarm-name-prefix 'quilty-web-dev-' \
            --query 'MetricAlarms[].AlarmName' --output text | tr '\t' '\n' | sed '/^$/d')
          if [ "${#names[@]}" -gt 0 ]; then
            echo "Suppressing actions on: ${names[*]}"
            aws cloudwatch disable-alarm-actions --region us-east-1 --alarm-names "${names[@]}"
          else
            echo "No quilty-web-dev-* alarms yet (first deploy) — nothing to suppress."
          fi

      - run: pnpm sst deploy --stage dev
        env:
          NEXT_PUBLIC_SITE_URL: https://my-quilty.com
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SST_DEPLOY_GATE_PASSED: 'true'
          WAF_WEB_ACL_ARN: ${{ vars.WAF_WEB_ACL_ARN }}
          # Permissions boundary SST attaches to every Lambda exec role it creates
          # (W2 / ADR-0071 sec 5; vended by quilty-aws website-baseline output).
          QUILTY_WEB_DEPLOY_BOUNDARY_ARN: ${{ vars.QUILTY_WEB_DEPLOY_BOUNDARY_ARN }}
          # HIPAA + GDPR Art 4(5) pseudonymisation salt — sst.config.ts
          # hard-gates on it (throws if unset). SECRET, vended from AWS
          # Secrets Manager by quilty-aws/website-baseline/.
          QUILTY_PSEUDONYM_PEPPER: ${{ secrets.QUILTY_PSEUDONYM_PEPPER }}
          # M2.1 — SNS alerts topic ARN. sst.config.ts hard-gates on it for the
          # durable `dev` stage (every CloudFront/Lambda/ACM alarm routes here).
          # Vended by quilty-aws/website-baseline/ (M1.1) as an SSM param.
          QUILTY_WEB_ALERTS_TOPIC_ARN: ${{ vars.QUILTY_WEB_ALERTS_TOPIC_ARN }}
          # M2.5 — CloudFront access-log bucket regional domain (M1.7). Optional;
          # when set, the distribution ships standard (v1) access logs to it.
          QUILTY_WEB_CLOUDFRONT_LOG_BUCKET_DOMAIN: ${{ vars.QUILTY_WEB_CLOUDFRONT_LOG_BUCKET_DOMAIN }}
          # M2.4 / D-T1-5 — pre-validated us-east-1 ACM cert ARN from quilty-aws
          # (the hosted-zone account). When set, the custom domain attaches and
          # the DaysToExpiry alarm is authored; absent => raw CloudFront URL.
          QUILTY_WEB_ACM_CERT_ARN: ${{ vars.QUILTY_WEB_ACM_CERT_ARN }}
          # Pre-launch SEO fail-safe. Read at `next build` time to bake the
          # sitewide X-Robots-Tag header. Set the SITE_FORCE_NOINDEX repo var
          # to 'true' during the placeholder phase; remove it at launch (and
          # run a CloudFront `/*` invalidation). Absent => indexable.
          SITE_FORCE_NOINDEX: ${{ vars.SITE_FORCE_NOINDEX }}

      # M2.8 — restore alarm actions no matter how the deploy ended. `if: always()`
      # guarantees the suppression window closes even on a failed/cancelled deploy,
      # so alarms never stay silently disabled. continue-on-error so a rare
      # transient enable-alarm-actions API error can't flip an otherwise-green
      # deploy red — which would also make the "Notify deploy result" step (it
      # reads job.status) wrongly report a failed deploy. Residual risk (alarms
      # left disabled after a failed re-enable) is low and self-heals on the next
      # deploy; real outages still page via the quilty-aws canary deadman +
      # SNS-delivery-failure alarms, which are independent of these action states.
      - name: Restore website alarm actions
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mapfile -t names < <(aws cloudwatch describe-alarms --region us-east-1 \
            --alarm-name-prefix 'quilty-web-dev-' \
            --query 'MetricAlarms[].AlarmName' --output text | tr '\t' '\n' | sed '/^$/d')
          if [ "${#names[@]}" -gt 0 ]; then
            echo "Re-enabling actions on: ${names[*]}"
            aws cloudwatch enable-alarm-actions --region us-east-1 --alarm-names "${names[@]}"
          fi
      # SEO fail-safe gate: confirm the live apex matches the INTENDED index
      # posture. Placeholder phase (var='true') MUST serve noindex; launched
      # (var unset/false) MUST be indexable. Either mismatch fails the
      # release — this is the guard that stops a forgotten noindex from
      # silently tanking launch SEO, and that confirms the placeholder really
      # is unindexed.
      - name: Verify production index posture (SEO fail-safe)
        # Pass the repo var through `env` rather than interpolating
        # `${{ }}` directly into the script (GitHub script-injection guard).
        env:
          WANT_NOINDEX: ${{ vars.SITE_FORCE_NOINDEX }}
        run: |
          set -uo pipefail
          want_noindex="$WANT_NOINDEX"
          read_tag() {
            curl -sSI https://my-quilty.com/en 2>/dev/null | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="x-robots-tag"{print tolower($2)}' || true
          }
          # The deploy already ran `invalidation: { wait: true }`, so the edge
          # is current. A short retry only covers brief edge warm-up — and is
          # only useful in the placeholder phase where we EXPECT the tag to
          # appear; in the launched phase its absence is the expected steady
          # state, so don't spin waiting for a tag that should never come.
          tag="$(read_tag)"
          if [ "$want_noindex" = "true" ]; then
            for _ in 1 2 3; do
              [ -n "$tag" ] && break
              sleep 5
              tag="$(read_tag)"
            done
          fi
          echo "X-Robots-Tag on /en: '${tag:-<absent>}'"
          if [ "$want_noindex" = "true" ]; then
            case "$tag" in
              *noindex*) echo "OK: placeholder phase — site is noindex." ;;
              *) echo "FAIL: SITE_FORCE_NOINDEX=true but /en is missing noindex."; exit 1 ;;
            esac
          else
            case "$tag" in
              *noindex*) echo "FATAL: prod is serving noindex but SITE_FORCE_NOINDEX is not 'true' — blocking release."; exit 1 ;;
              *) echo "OK: launched posture — /en is indexable." ;;
            esac
          fi

      # M2.7 — deploy-result notification. Publishes a deploy success/failure
      # line to the same SNS alerts topic the alarms use, so Slack + email get a
      # release signal (and a failed deploy is impossible to miss). Best-effort:
      # a green deploy must not be flipped red by a notification hiccup, and the
      # publish itself surfaces in the step log if the alert pipe is broken.
      # `if: always()` so a FAILED deploy still notifies. The deploy role (admin
      # + boundary, same account as the topic) can sns:Publish over HTTPS, which
      # the topic's DenyInsecureTransport statement permits.
      - name: Notify deploy result
        if: always()
        continue-on-error: true
        env:
          TOPIC_ARN: ${{ vars.QUILTY_WEB_ALERTS_TOPIC_ARN }}
          DEPLOY_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${TOPIC_ARN:-}" ]; then
            echo "QUILTY_WEB_ALERTS_TOPIC_ARN unset — skipping deploy notification."
            exit 0
          fi
          subject="[quilty-web] dev deploy ${DEPLOY_RESULT}"
          aws sns publish --region us-east-1 --topic-arn "$TOPIC_ARN" \
            --subject "$subject" \
            --message "quilty-website dev deploy ${DEPLOY_RESULT} for ${COMMIT_SHA}. Run: ${RUN_URL}"
